deployment:
  tasks:
    - export DEPLOYPATH=/home/$USER/public_html/mfdb
    - mkdir -p $DEPLOYPATH
    - /bin/cp index.html $DEPLOYPATH/index.new.html
    - /bin/mv -f $DEPLOYPATH/index.new.html $DEPLOYPATH/index.html
    - if [ -f womens.html ]; then /bin/cp womens.html $DEPLOYPATH/womens.new.html && /bin/mv -f $DEPLOYPATH/womens.new.html $DEPLOYPATH/womens.html; fi
