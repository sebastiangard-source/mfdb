<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maggie’s List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F7F7;--card:#fff;--ink:#1B2530;--muted:#5A6672;--rule:#D5DBDD;--t1:#F2EEE2;--t2:#E9EFE7;--t3:#E6EAF0;--t4:#EFE6E8;--oth:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 64px}
h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:32px;line-height:1.15;margin:0 0 8px;letter-spacing:-.01em}
h2{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:21px;margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font-family:"Figtree",system-ui,sans-serif;font-size:13px;font-weight:400;color:var(--muted)}
h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 8px}
.sub{color:var(--muted);margin:0 0 16px;max-width:78ch}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px;margin-bottom:16px}
.def{color:var(--muted);font-size:13px;margin:2px 0 12px}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 16px}
input[type=search]{font:inherit;padding:8px 12px;border:1px solid var(--rule);border-radius:999px;background:#fff;color:var(--ink);width:260px}
.total{font-size:15px}.total b{font-family:"Fraunces",Georgia,serif;font-size:24px;font-weight:600;margin-right:4px}
button.dl{font:inherit;font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid var(--rule);background:#fff;cursor:pointer;margin-left:auto}
button.dl:hover{border-color:var(--ink)}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.b{display:inline-flex;align-items:baseline;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid transparent;font-size:14px;cursor:pointer;background:var(--oth)}
.b:hover{border-color:var(--ink)}
.b .c{font-size:11.5px;color:var(--muted)}
.b .w{font-size:10.5px;color:#8A5A00;letter-spacing:.02em}
.T1 .b{background:var(--t1)}.T2 .b{background:var(--t2)}.T3 .b{background:var(--t3)}.T4 .b{background:var(--t4)}.Oth .b{border-color:var(--rule)}
.b.out{display:none}
.note{color:var(--muted);font-size:13px;margin:10px 0 0}
nav a:hover{background:#1C7C74!important;color:#fff!important}
</style>
</head>
<body>
<nav style="font:500 14px Figtree,system-ui,sans-serif;padding:12px 24px;border-bottom:1px solid #D5DBDD;background:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px"><a href="explorer.html" onclick="if(document.referrer.indexOf('explorer')>-1&&history.length>1){history.back();return false}" style="display:inline-block;padding:6px 14px;border-radius:999px;border:1px solid #1C7C74;text-decoration:none;font-weight:500;color:#1C7C74;background:#fff">← The Cyprus Brand Explorer</a><span style="width:1px;height:22px;background:#D5DBDD;margin:0 4px"></span><span aria-current="page" style="display:inline-block;padding:6px 14px;border-radius:999px;border:1px solid #1C7C74;text-decoration:none;font-weight:500;color:#fff;background:#1C7C74">Maggie’s list</span><a href="overlaps.html" style="display:inline-block;padding:6px 14px;border-radius:999px;border:1px solid #1C7C74;text-decoration:none;font-weight:500;color:#1C7C74;background:#fff">How the brand lists overlap →</a><a href="cake-croissant.html" style="display:inline-block;padding:6px 14px;border-radius:999px;border:1px solid #1C7C74;text-decoration:none;font-weight:500;color:#1C7C74;background:#fff">Brands on CAKE and Croissant →</a><a href="ws-cake-croissant.html" style="display:inline-block;padding:6px 14px;border-radius:999px;border:1px solid #1C7C74;text-decoration:none;font-weight:500;color:#1C7C74;background:#fff">WS centers, CAKE and Croissant →</a></nav>
<div class="wrap">
<h1>Maggie’s List</h1>
<p class="sub">The brands Maggie picked from The Cyprus Brand Explorer, by tier. Click a brand to open its card.</p>
<div class="ctl"><span class="total" id="total"></span><input type="search" id="q" placeholder="Find a brand" aria-label="Find a brand"><button class="dl" id="dl">Download CSV</button></div>
<div id="tiers"></div>
<p class="note" id="foot"></p>
</div>
<script>
/*DATA*/
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var TIERS=[['Tier 1','T1','Tee $35 or less, shirt under $80 · mass market'],['Tier 2','T2','Blouse and sweater from under $200 · contemporary and mall brands'],['Tier 3','T3','$200 to $600 · advanced contemporary'],['Tier 4','T4','Over $600 · luxury and designer houses']];
function render(){
  var q=$('q').value.trim().toLowerCase(), html='', n=0, st=0;
  var grp=TIERS.map(function(t){return {name:t[0],cls:t[1],def:t[2],list:L.filter(function(x){return x.t===t[0]})}});
  var cats=[];L.forEach(function(x){if(x.cat&&cats.indexOf(x.cat)<0)cats.push(x.cat)});
  grp.forEach(function(g){if(!g.list.length)return;var s=g.list.reduce(function(a,x){return a+(x.s||0)},0);
    html+='<section class="card '+g.cls+'"><h2>'+g.name+'<small>'+g.list.length+' brands · '+s.toLocaleString()+' US stores</small></h2><p class="def">'+g.def+'</p><div class="grid">'+g.list.map(chip).join('')+'</div></section>'});
  var oth=L.filter(function(x){return x.cat});
  if(oth.length){var s=oth.reduce(function(a,x){return a+(x.s||0)},0);
    html+='<section class="card Oth"><h2>Other brands<small>'+oth.length+' brands · '+s.toLocaleString()+' US stores</small></h2><p class="def">Beauty, fragrance, travel, eyewear and bags, with stores of their own.</p>'+
      cats.map(function(c){return '<h3>'+esc(c)+'</h3><div class="grid">'+oth.filter(function(x){return x.cat===c}).map(chip).join('')+'</div>'}).join('')+'</section>'}
  $('tiers').innerHTML=html;
  [].forEach.call(document.querySelectorAll('.b'),function(el){var hit=!q||el.getAttribute('data-brand').toLowerCase().indexOf(q)>-1;el.classList.toggle('out',!hit);if(hit){n++;st+=+el.getAttribute('data-s')||0}});
  $('total').innerHTML='<b>'+n+'</b> '+(q?'of '+L.length+' brands':'brands')+' · '+st.toLocaleString()+' US stores';
}
function chip(x){return '<span class="b" data-brand="'+esc(x.n)+'" data-s="'+(x.s||0)+'" tabindex="0" title="'+esc(x.seg||x.cat||'')+'"><span>'+esc(x.n)+'</span><span class="c">'+(x.s==null?'':x.s)+'</span>'+(x.was?'<span class="w" title="Tier when Maggie picked it">was '+esc(x.was)+'</span>':'')+'</span>'}
$('q').addEventListener('input',render);
$('dl').onclick=function(){var rows=[['Tier','Brand','US stores','Segment or category','Tier when picked']].concat(L.map(function(x){return [x.cat?'Other brands':x.t,x.n,x.s==null?'':x.s,x.seg||x.cat||'',x.was||'']}));
  var csv=rows.map(function(r){return r.map(function(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='maggies_list.csv';a.click();};
window.cardCtx=function(n){return {lists:["Maggie’s list"]}};
$('foot').textContent='Picked '+PICKED+'. Tiers and store counts are the Explorer’s current figures; “was” marks a brand whose tier has changed since.'+(MISSING.length?' No longer on the Explorer: '+MISSING.join(', ')+'.':'');
render();
</script>
<script src="cards.js"></script>
</body>
</html>
